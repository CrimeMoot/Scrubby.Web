name: Publish Scrubby.Web Container
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  packages: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Scrubby.Web server image
        run: docker build -f Scrubby.Web/Dockerfile -t ghcr.io/crimemoot/scrubby.web:latest .

      - name: Push container
        run: docker push ghcr.io/crimemoot/scrubby.web:latest
